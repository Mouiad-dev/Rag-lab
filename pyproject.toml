[tool.uv]
required-version = ">=0.7.9"

[tool.uv.workspace]
members = ["packages/core", "apps/api", "apps/worker"]

[tool.uv.sources]
rag-foundry-core = { workspace = true }
rag-foundry-api = { workspace = true }
rag-foundry-worker = { workspace = true }

[dependency-groups]
dev = ["pytest>=9.2", "ruff>=0.17", "rag-foundry-core", "rag-foundry-api", "rag-foundry-worker"]

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = [".claude", "scripts", "tests/hooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["--import-mode=importlib", "--strict-markers"]

[tool.ruff.format]
exclude = ["*.md"]
