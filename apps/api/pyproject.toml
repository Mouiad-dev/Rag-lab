[build-system]
requires = ["hatchling>=1.33"]
build-backend = "hatchling.build"

[project]
name = "rag-foundry-api"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
    "rag-foundry-core",
    "rag-foundry-contracts",
    "rag-foundry-domain",
    "rag-foundry-ingestion",
    "rag-foundry-storage[sql]",
    "rag-foundry-answering",
    "rag-foundry-indexing",
    "rag-foundry-providers[ollama]",
    "fastapi>=0.162.0",
    "uvicorn>=0.54.0",
    "python-multipart==0.0.32",
]

[project.scripts]
rag-foundry-api = "rag_foundry_api.main:run"

[tool.uv.sources]
rag-foundry-core = { workspace = true }
rag-foundry-contracts = { workspace = true }
rag-foundry-domain = { workspace = true }
rag-foundry-ingestion = { workspace = true }
rag-foundry-storage = { workspace = true }
rag-foundry-answering = { workspace = true }
rag-foundry-indexing = { workspace = true }
rag-foundry-providers = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/rag_foundry_api"]
