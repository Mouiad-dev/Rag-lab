name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  repo-checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify repository structure and catalogue
        run: python scripts/verify_package.py
      - name: Hook tests
        run: python -m unittest discover -s tests/hooks -v
      - name: Flow view is up to date
        run: python scripts/build_flow.py --check
