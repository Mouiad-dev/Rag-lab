[build-system]
requires = ["hatchling>=1.33"]
build-backend = "hatchling.build"

[project]
name = "rag-foundry-providers"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.14.2",
]

[project.optional-dependencies]
ollama = ["httpx==0.28.1"]
anthropic = ["httpx==0.28.1"]
openai_compatible = ["httpx==0.28.1"]
# R05 learned sparse (owner OK 2026-11-08). CPU torch comes from the pytorch-cpu index (root pyproject).
sparse = ["sentence-transformers==6.2.0", "torch==2.15.0"]
# C20/R45 per-token vectors (owner OK 2026-11-23); same pins as sparse. Loads safetensors only.
tokens = ["sentence-transformers==6.2.0", "torch==2.15.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/rag_foundry_providers"]
