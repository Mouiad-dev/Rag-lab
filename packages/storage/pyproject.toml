[build-system]
requires = ["hatchling>=1.33"]
build-backend = "hatchling.build"

[project]
name = "rag-foundry-storage"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
    "rag-foundry-domain",
]

[tool.uv.sources]
rag-foundry-domain = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/rag_foundry_storage"]
