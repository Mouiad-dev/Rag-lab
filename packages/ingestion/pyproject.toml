[build-system]
requires = ["hatchling>=1.33"]
build-backend = "hatchling.build"

[project]
name = "rag-foundry-ingestion"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
    "rag-foundry-contracts",
    "rag-foundry-domain",
]

[project.optional-dependencies]
html = ["selectolax==1.0.1"]
pdf = ["pypdfium2==5.14.0"]

[tool.uv.sources]
rag-foundry-domain = { workspace = true }
rag-foundry-contracts = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/rag_foundry_ingestion"]
